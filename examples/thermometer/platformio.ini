
[platformio]
default_envs = esp32
src_dir = src
include_dir = include

[env]
platform = platformio/espressif32
framework = espidf
build_type = release
monitor_speed = 115200
board_build.esp-idf.preserve_source_file_extension = yes

build_flags =
    -Os
    -DESP32
    -DAETHER_PLATFORM_CONTEXT_BYTES=3200u
    -ffunction-sections
    -fdata-sections

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
